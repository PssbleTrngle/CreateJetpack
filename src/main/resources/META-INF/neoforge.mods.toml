modLoader = "javafml"
loaderVersion = "[1,)"
license = "https://github.com/${repository}/blob/main/neoforge/1.21.x/LICENSE.md"
issueTrackerURL = "https://github.com/${repository}/issues"

[[mods]]
    modId = "${mod_id}"
    version = "${mod_version}"
    displayName = "${mod_name}"
    authors = "${mod_author}"
    description = "${mod_description}"
    updateJSONURL="https://api.modrinth.com/updates/create-jetpack/forge_updates.json?neoforge=only"
    logoFile = "assets/${mod_id}/icon.png"

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    versionRange = "[21,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "[1.21.1,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId="kotlinforforge"
    mandatory=true
    versionRange="[5.8,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId = "create"
    mandatory = true
    versionRange = "[6.0.0,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "flightlib"
    mandatory = true
    versionRange = "[4.0.36,)"
    ordering = "NONE"
    side = "BOTH"
